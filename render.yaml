# Render Blueprint: New > Blueprint > pick this repo. Set GROQ_API_KEY when prompted.
services:
  - type: web
    name: powerup-money-faq
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false          # secret: entered in the Render dashboard, never committed
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_PROVIDER
        value: groq
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: TOP_K
        value: "5"
      - key: RELEVANCE_THRESHOLD
        value: "0.70"
