# Same image as Render, run locally:  docker compose up --build  ->  http://localhost:8080
# Put GROQ_API_KEY in backend/.env (never commit it).
services:
  app:
    build: .
    env_file:
      - path: backend/.env
        required: false
    environment:
      PORT: "8000"
    ports:
      - "8080:8000"
